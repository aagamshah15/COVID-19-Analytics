[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "covid-pipeline"
version = "2.0.0"
description = "COVID-19 global healthcare burden pipeline: OWID + WHO ETL, DuckDB star schema, data quality gate and weekly deaths forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.1",
    "scikit-learn>=1.4",
    "pycountry>=23.12",
]

[project.optional-dependencies]
postgres = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9"]
notebooks = ["jupyter", "matplotlib>=3.8", "seaborn>=0.13"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
covid-pipeline = "covid_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

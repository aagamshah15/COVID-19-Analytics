name: pipeline

# Rebuilds every layer from the live OWID, WHO and World Bank sources, trains the simulator, then builds the dashboard and
# publishes it to GitHub Pages. Requires Pages to be enabled with "GitHub Actions" as the source.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The run now trains the simulator too (about 12 minutes on a laptop, longer on a shared runner).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pipeline
        run: pip install -e .
      - name: Run pipeline (fails if the data quality gate fails)
        run: covid-pipeline run
      - name: Export dashboard data
        run: covid-pipeline web-export
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build dashboard
        working-directory: dashboard
        env:
          # Optional: the simulator's cloud API (docs/simulator/CLOUD.md). Unset, the page hides that button.
          VITE_SIM_API_URL: ${{ vars.SIM_API_URL }}
        run: |
          npm ci
          npm test
          npm run build
      - name: Upload pipeline outputs
        uses: actions/upload-artifact@v4
        with:
          name: covid-pipeline-outputs
          path: |
            reports/
            data/raw/manifest.json
            data/processed/tableau_exec_extract.csv
            data/processed/forecast_weekly_deaths.csv
            warehouse/covid_dw.duckdb
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: pipeline

# Rebuilds every layer from the live OWID + WHO sources. The analysis window (2020-2023) is
# historical, so a weekly run is enough to pick up upstream revisions.
on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "Analysis window end date"
        default: "2023-12-31"
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Run pipeline (fails if the data quality gate fails)
        run: covid-pipeline run --end-date "${{ inputs.end_date || '2023-12-31' }}"
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: covid-pipeline-outputs
          path: |
            reports/
            data/raw/manifest.json
            data/processed/tableau_exec_extract.csv
            data/processed/forecast_weekly_deaths.csv
            warehouse/covid_dw.duckdb
